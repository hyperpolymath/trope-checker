name: "⚙ Auto: Mirror to forges"
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  actions: read
  contents: read
jobs:
  mirror:
    # Explicit on the calling job (a job-level block replaces, never merges
    # with, the workflow-level one). Pin advanced in step with the other
    # standards reusables (2026-10-28); workflow-linter.yml re-resolves it.
    permissions:
      actions: read
      contents: read
    uses: hyperpolymath/standards/.github/workflows/mirror-reusable.yml@34cf03f988b8ca95b91b45d9b3351f7d3babfb65
    # Required by the called workflow: forge SSH keys live as repo secrets; the reusable names each one it reads.
    secrets: inherit # zizmor: ignore[secrets-inherit]
