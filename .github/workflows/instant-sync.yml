# Instant Forge Sync - Triggers propagation to all forges on push/release
name: "⚙ Auto: Instant sync"
on:
  push:
    branches: [main, master]
  release:
    types: [published]
permissions:
  contents: read
jobs:
  dispatch:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      HAS_DISPATCH_TOKEN: ${{ secrets.FARM_DISPATCH_TOKEN != '' }}
    steps:
      - name: Trigger Propagation
        if: env.HAS_DISPATCH_TOKEN == 'true'
        uses: peter-evans/repository-dispatch@v4.0.1
        with:
          token: ${{ secrets.FARM_DISPATCH_TOKEN }}
          repository: hyperpolymath/.git-private-farm
          event-type: propagate
          client-payload: |-
            {
              "repo": "${{ github.event.repository.name }}",
              "ref": "${{ github.ref }}",
              "sha": "${{ github.sha }}",
              "forges": ""
            }
      - name: Confirm
        env:
          REPO_NAME: ${{ github.event.repository.name }}
        run: |
          if [ "$HAS_DISPATCH_TOKEN" = "true" ]; then
            echo "::notice::Propagation triggered for ${REPO_NAME}"
          else
            echo "::notice::FARM_DISPATCH_TOKEN not configured; propagation skipped for ${REPO_NAME}"
          fi
