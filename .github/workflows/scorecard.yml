name: "⚪ Advisory: OpenSSF Scorecard (score)"

on:
  schedule:
    - cron: '0 4 * * *'
  workflow_dispatch:

permissions:
  actions: read
  contents: read
  id-token: write
  security-events: write

jobs:
  scorecard:
    # Granted on the CALLING JOB, as the called workflow requires: a job-level
    # block replaces (never merges with) the workflow-level one, and the
    # called jobs cannot exceed this grant. Previously only the workflow
    # level carried these, and the pin below was a commit that no longer
    # exists in standards (8750b94…, orphaned by that repo's history move),
    # so every run failed at STARTUP with zero jobs and no check appeared
    # on the PR at all. Re-pinned 2026-10-28 to a commit verified to exist;
    # workflow-linter.yml now re-resolves every reusable pin on each run.
    permissions:
      actions: read
      contents: read
      id-token: write
      security-events: write
    uses: hyperpolymath/standards/.github/workflows/scorecard-reusable.yml@34cf03f988b8ca95b91b45d9b3351f7d3babfb65
