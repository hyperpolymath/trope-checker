#
# Release workflow — triggered by version tags (v*).
# Builds artifacts, generates changelog via git-cliff, creates a GitHub Release,
# and produces SLSA provenance attestations.
name: "⚙ Auto: Release"
on:
  push:
    tags:
      - 'v*'
permissions:
  contents: read
jobs:
  build:
    name: Build Artifacts
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false
      - name: Detect project type and build
        id: build
        run: |
          # Auto-detect build system from project files.
          # Order matters: more specific markers checked first.
          if [ -f "mix.exs" ]; then
            echo "::notice::Detected Elixir/Gleam project (mix.exs)"
            echo "build_type=mix" >> "$GITHUB_OUTPUT"
            mix local.hex --force --if-missing
            mix local.rebar --force --if-missing
            mix deps.get --only prod
            MIX_ENV=prod mix release
          elif [ -f "Cargo.toml" ]; then
            echo "::notice::Detected Rust project (Cargo.toml)"
            echo "build_type=cargo" >> "$GITHUB_OUTPUT"
            cargo build --release
          elif [ -f "build.zig" ]; then
            echo "::notice::Detected Zig project (build.zig)"
            echo "build_type=zig" >> "$GITHUB_OUTPUT"
            zig build -Doptimize=ReleaseSafe
          elif [ -f "gossamer.conf.json" ]; then
            echo "::notice::Detected Gossamer project (gossamer.conf.json)"
            echo "build_type=gossamer" >> "$GITHUB_OUTPUT"
            gossamer build
          elif [ -f "gleam.toml" ]; then
            echo "::notice::Detected Gleam project (gleam.toml)"
            echo "build_type=gleam" >> "$GITHUB_OUTPUT"
            gleam build
          elif [ -f "rebar.config" ]; then
            echo "::notice::Detected Erlang/Rebar project (rebar.config)"
            echo "build_type=rebar" >> "$GITHUB_OUTPUT"
            rebar3 as prod release
          elif [ -f "Justfile" ] || [ -f "justfile" ]; then
            echo "::notice::Detected Justfile — running 'just build'"
            echo "build_type=just" >> "$GITHUB_OUTPUT"
            just build
          else
            echo "::error::No recognised build system found."
            echo "Expected one of: mix.exs, Cargo.toml, build.zig, gossamer.conf.json, gleam.toml, rebar.config, Justfile"
            exit 1
          fi
        # TODO: Upload build artifacts if needed
        # - uses: actions/upload-artifact@v4
        #
        # with:
        #     name: release-artifacts
        #     path: target/release/
  changelog:
    name: Generate Changelog
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
    outputs:
      changelog: ${{ steps.cliff.outputs.content }}
      version: ${{ steps.version.outputs.version }}
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0
      - name: Extract version from tag
        id: version
        run: echo "version=${GITHUB_REF_NAME#v}" >> "$GITHUB_OUTPUT"
      - name: Install git-cliff (pinned, checksummed)
        env:
          GIT_CLIFF_VERSION: 2.14.2
          GIT_CLIFF_SHA256: 24f397c733add5390fdceee3a2088588ab0d5f944ce00d34cb7029b888cf2db4
        run: |
          # Was releases/latest/... with an asset name upstream does not
          # publish (missing the version segment), i.e. a guaranteed 404 on
          # the next tag. Pin the version and verify the asset digest before
          # it lands in /usr/local/bin. x86_64 asset: ubuntu-latest hosted
          # runners are x86_64; bump version+sha together.
          set -euo pipefail
          asset="git-cliff-${GIT_CLIFF_VERSION}-x86_64-unknown-linux-gnu.tar.gz"
          curl --fail --proto '=https' --proto-redir '=https' --tlsv1.2 -sSL \
            -o "$RUNNER_TEMP/$asset" \
            "https://github.com/orhun/git-cliff/releases/download/v${GIT_CLIFF_VERSION}/$asset"
          echo "${GIT_CLIFF_SHA256}  $RUNNER_TEMP/$asset" | sha256sum -c -
          mkdir -p "$RUNNER_TEMP/git-cliff-extract"
          tar -xzf "$RUNNER_TEMP/$asset" -C "$RUNNER_TEMP/git-cliff-extract"
          find "$RUNNER_TEMP/git-cliff-extract" -maxdepth 3 -type f -name git-cliff \
            -exec install -m 0755 {} /usr/local/bin/git-cliff \;
          git cliff --version
      - name: Generate changelog for this release
        id: cliff
        run: |
          # Generate changelog for the current tag only
          CHANGELOG=$(git cliff --latest --strip header)
          # Write to output using delimiter to handle multiline
          {
            echo "content<<CLIFF_EOF"
            echo "$CHANGELOG"
            echo "CLIFF_EOF"
          } >> "$GITHUB_OUTPUT"
      - name: Update full CHANGELOG.md
        run: |
          git cliff --output CHANGELOG.md
      - name: Upload updated CHANGELOG.md
        uses: actions/upload-artifact@v7.0.2
        with:
          name: changelog
          path: CHANGELOG.md
          retention-days: 5
  release:
    name: Create GitHub Release
    needs: [build, changelog]
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false
      # TODO: Download build artifacts if uploading to the release
      # - uses: actions/download-artifact@v4
      #
      # with:
      #     name: release-artifacts
      #     path: artifacts/
      - name: Create GitHub Release
        # zizmor: ignore[superfluous-actions] — kept deliberately: release body comes from the
        # changelog job output and this action is the audited estate pattern.
        uses: softprops/action-gh-release@v3.0.3
        with:
          body: ${{ needs.changelog.outputs.changelog }}
          draft: false
          prerelease: ${{ contains(github.ref_name, '-rc') || contains(github.ref_name, '-beta') || contains(github.ref_name, '-alpha') }}
          generate_release_notes: false
          # TODO: Add artifact files to the release
          # files: |
          #   artifacts/*
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
  provenance:
    name: SLSA Provenance
    needs: [build]
    permissions:
      actions: read
      id-token: write
      contents: write
    # SLSA generator must run in a separate, isolated workflow
    # See: https://slsa.dev/spec/v1.0/requirements#build-l3
    uses: slsa-framework/slsa-github-generator/.github/workflows/generator_generic_slsa3.yml@f7dd8c54c2067bafc12ca7a55595d5ee9b75204a # v2.1.0
    with:
      base64-subjects: ""
      # TODO: Replace with actual artifact hashes
      # Generate with: sha256sum artifact | base64 -w0
      # base64-subjects: "${{ needs.build.outputs.hashes }}"
