# This workflow is managed by gh actions-lock.
# This workflow is managed by gh actions-lock.
# workflow-linter.yml - Validates GitHub workflows against RSR security standards
# This workflow can be copied to other repos for consistent enforcement
#
# The enforcement core is actionlint (workflow semantics + shellcheck over
# every `run:` script) and zizmor (GitHub Actions security audit), both
# version- and checksum-pinned below, plus the estate's own rules that no
# off-the-shelf tool knows: SPDX header blocks, a top-level permissions
# declaration, actions.lock coverage, and — the check whose absence let
# three reusable-workflow pins rot into commits that no longer exist —
# live re-resolution of every external `uses:` ref.
name: "🟡 Check: Workflow security lint"

on:
  push:
    paths:
      - '.github/workflows/**'
      - '.github/zizmor.yml'
  pull_request:
    paths:
      - '.github/workflows/**'
      - '.github/zizmor.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  lint-workflows:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read

    steps:
      - name: Checkout
        uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false

      - name: Check SPDX Headers
        run: |
          # An SPDX tag counts when it is in the file's leading comment block
          # (the REUSE convention), NOT only when it is literally line 1:
          # gh actions-lock prepends its own "# This workflow is managed by
          # gh actions-lock." banner to line 1 of every workflow it touches,
          # so the old `head -1` test failed all 26 workflows — including
          # this one — forever. A test that cannot pass is not a gate; the
          # genuine miss it was hiding (main-estate-audit.yml had no SPDX at
          # all) is fixed and is now actually enforced by this version.
          python3 - <<'PY'
          import glob, sys
          failed = []
          for path in sorted(glob.glob('.github/workflows/*.yml') + glob.glob('.github/workflows/*.yaml')):
              ok = False
              for line in open(path, encoding='utf-8'):
                  s = line.strip()
                  if not s.startswith('#'):
                      if s:
                          break          # first non-comment: header block over
                      continue           # blank line inside/after the header
                  if s.startswith('# SPDX-License-Identifier:'):
                      ok = True
                      break
              if not ok:
                  print(f"::error file={path}::missing SPDX-License-Identifier in the leading comment block")
                  failed.append(path)
          if failed:
              print("Add '# SPDX-License-Identifier: MPL-2.0' to the header comment block")
              sys.exit(1)
          print("All workflows carry an SPDX tag in the header comment block")
          PY

      - name: Check Permissions Declaration
        run: |
          echo "=== Checking Permissions ==="
          failed=0
          for file in .github/workflows/*.yml .github/workflows/*.yaml; do
            [ -f "$file" ] || continue
            if ! grep -q "^permissions:" "$file"; then
              echo "ERROR: $file missing top-level 'permissions:' declaration"
              failed=1
            fi
            if grep -qE "^permissions:\s*(write-all|read-all)" "$file"; then
              echo "ERROR: $file uses a blanket permissions grant; enumerate least-privilege scopes"
              failed=1
            fi
          done
          if [ $failed -eq 1 ]; then
            echo "Add a top-level 'permissions:' block (usually contents: read)"
            exit 1
          fi
          echo "All workflows declare enumerated top-level permissions"

      - name: Verify actions.lock coverage
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          echo "=== Checking Action Pinning (actions.lock coverage) ==="
          if [ ! -f .github/workflows/actions.lock ]; then
            echo "ERROR: .github/workflows/actions.lock is missing — run 'gh actions-lock'"
            exit 1
          fi
          gh extension install github/gh-actions-lock
          # --verify-local is a COVERAGE check (every uses: has a lock entry),
          # not a provenance check; the next step supplies the missing half
          # by re-resolving each ref against the live repositories.
          gh actions-lock --verify-local
          echo "Lockfile coverage verified"

      - name: Every external uses ref resolves, and none floats
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          # The blind spot that structured the estate's worst invisible red:
          # jobs.<id>.uses (reusable workflows) is a documented actions-lock
          # limitation, and a coverage check cannot notice that a 40-hex pin
          # stops existing upstream. Three standards reusable pins in this
          # repo did exactly that; the runs failed at startup with zero
          # jobs, so not even a red tick appeared on any PR. Resolution is
          # the only check that sees it, so resolve: hash pins must be
          # fetchable commits in their repo, everything else must be an
          # existing version tag. Branch refs (@main) fail by construction.
          python3 - <<'PY'
          import glob, re, subprocess, sys
          uses_re = re.compile(r'^[ \t]*(?:-[ \t]*)?uses:[ \t]*([^ \t#]+/[^\s#@]+)@([^\s#]+)')
          version_re = re.compile(r'^v?\d+(\.\d+)*([-.+][0-9A-Za-z.-]+)?$')
          seen, failed = {}, []
          for path in sorted(glob.glob('.github/workflows/*.yml') + glob.glob('.github/workflows/*.yaml')):
              for n, line in enumerate(open(path, encoding='utf-8'), 1):
                  m = uses_re.match(line)
                  if not m:
                      continue
                  coord, ref = m.groups()
                  if coord.startswith(('./', 'docker://')):
                      continue
                  repo = '/'.join(coord.split('/')[:2])
                  key = (repo, ref)
                  if key in seen:
                      continue
                  seen[key] = (path, n)
                  if re.fullmatch(r'[0-9a-f]{40}', ref):
                      r = subprocess.run(['gh', 'api', f'repos/{repo}/commits/{ref}', '--jq', '.sha'],
                                         capture_output=True, text=True)
                      if r.returncode != 0 or r.stdout.strip() != ref:
                          print(f"::error file={path},line={n}::pin {coord}@{ref} does not resolve to a commit in {repo} (phantom pin: runs using it fail at startup, invisibly)")
                          failed.append(key)
                  elif version_re.match(ref):
                      r = subprocess.run(['gh', 'api', f'repos/{repo}/git/ref/tags/{ref}'],
                                         capture_output=True, text=True)
                      if r.returncode != 0:
                          print(f"::error file={path},line={n}::tag {coord}@{ref} does not resolve in {repo}")
                          failed.append(key)
                  else:
                      print(f"::error file={path},line={n}::floating ref {coord}@{ref}: pin a full commit SHA or an exact version tag")
                      failed.append(key)
          print(f"resolved {len(seen)} distinct external uses refs")
          if failed:
              sys.exit(1)
          print("Every external uses: ref resolves; none floats")
          PY

      - name: Install pinned actionlint and shellcheck
        env:
          ACTIONLINT_VERSION: 1.7.12
          ACTIONLINT_SHA256: 8aca8db96f1b94770f1b0d72b6dddcb1ebb8123cb3712530b08cc387b349a3d8
          SHELLCHECK_VERSION: 0.11.0
          SHELLCHECK_SHA256: 8c3be12b05d5c177a04c29e3c78ce89ac86f1595681cab149b65b97c4e227198
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/lint-tools" && cd "$RUNNER_TEMP/lint-tools"
          curl --fail --proto '=https' --proto-redir '=https' --tlsv1.2 -sSL \
            -o actionlint.tar.gz \
            "https://github.com/rhysd/actionlint/releases/download/v${ACTIONLINT_VERSION}/actionlint_${ACTIONLINT_VERSION}_linux_amd64.tar.gz"
          echo "${ACTIONLINT_SHA256}  actionlint.tar.gz" | sha256sum -c -
          tar -xzf actionlint.tar.gz actionlint
          curl --fail --proto '=https' --proto-redir '=https' --tlsv1.2 -sSL \
            -o shellcheck.tar.xz \
            "https://github.com/koalaman/shellcheck/releases/download/v${SHELLCHECK_VERSION}/shellcheck-v${SHELLCHECK_VERSION}.linux.x86_64.tar.xz"
          echo "${SHELLCHECK_SHA256}  shellcheck.tar.xz" | sha256sum -c -
          tar -xJf shellcheck.tar.xz --strip-components=1 "shellcheck-v${SHELLCHECK_VERSION}/shellcheck"
          echo "$PWD" >> "$GITHUB_PATH"
          ./actionlint -version
          ./shellcheck --version | head -2

      - name: actionlint (workflow semantics + shellcheck over run scripts)
        id: actionlint
        run: actionlint -no-color -verbose

      # Failure-only: re-run actionlint in annotation format so every finding
      # lands on the PR as a file/line check annotation, readable via the
      # checks API without downloading raw logs. (A bare `exit code 1`
      # annotation cost a full debug cycle once already.)
      - name: actionlint diagnostics (annotations, on failure only)
        if: failure() && steps.actionlint.outcome == 'failure'
        run: |
          actionlint -no-color > "$RUNNER_TEMP/actionlint.txt" 2>&1 || true
          head -9 "$RUNNER_TEMP/actionlint.txt" | while IFS= read -r line; do
            echo "::error::actionlint: $line"
          done
          {
            echo "## actionlint diagnostics ($(wc -l < "$RUNNER_TEMP/actionlint.txt") lines)"
            echo '```'
            cat "$RUNNER_TEMP/actionlint.txt"
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Install pinned zizmor
        run: |
          # Hash-pinned to the exact wheel pip resolves on this runner.
          cat > "$RUNNER_TEMP/zizmor-requirements.txt" <<'REQ'
          zizmor==1.31.1 --hash=sha256:58e878eb2dbd2c6183c105e1ac28c14f7dd1eca44a783f1fe2a69647d012c410
          REQ
          python3 -m pip install --quiet --require-hashes -r "$RUNNER_TEMP/zizmor-requirements.txt"
          zizmor --version

      - name: zizmor (GitHub Actions security audit)
        env:
          GH_TOKEN: ${{ github.token }}
        run: zizmor --strict-collection --config .github/zizmor.yml .github/workflows/

      - name: Check for Duplicate Workflows
        run: |
          echo "=== Checking for Duplicates ==="
          if [ -f .github/workflows/codeql.yml ] && [ -f .github/workflows/codeql-analysis.yml ]; then
            echo "ERROR: Duplicate CodeQL workflows found"
            echo "Delete codeql-analysis.yml (keep codeql.yml)"
            exit 1
          fi
          echo "No critical duplicates found"

      - name: Summary
        run: |
          echo ""
          echo "=== Workflow Linter Summary ==="
          echo "SPDX header blocks, permissions, actions.lock coverage, live ref"
          echo "resolution, actionlint, and zizmor all passed."
