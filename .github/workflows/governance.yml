name: "🟡 Check: Governance metadata"

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]
  workflow_dispatch:

permissions:
  actions: read
  contents: read

jobs:
  governance:
    # Explicit on the calling job (a job-level block replaces, never merges
    # with, the workflow-level one). The previous pin (8f31a5a…) no longer
    # exists in hyperpolymath/standards, so this workflow failed at startup
    # with zero jobs — invisible in `gh pr checks`. Re-pinned 2026-10-28 to
    # a verified-existing commit; workflow-linter.yml now re-resolves pins.
    permissions:
      actions: read
      contents: read
    uses: hyperpolymath/standards/.github/workflows/governance-reusable.yml@34cf03f988b8ca95b91b45d9b3351f7d3babfb65
    with:
      # Strictest baseline mode: if a .hypatia-baseline.json acknowledgement
      # ever lands here it must carry an expires_at, or this fails. (The repo
      # has no baseline file today, so this is vacuous until one appears —
      # which is exactly when it should start biting.)
      baseline-strict: true
