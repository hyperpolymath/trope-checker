# This workflow is managed by gh actions-lock.
# SPDX-License-Identifier: MPL-2.0
# This workflow is managed by gh actions-lock.
# This workflow is managed by gh actions-lock.
# Static analysis — advisory CHECK, deliberately NOT a blocking gate.
#
# Tier: 🟡 CHECK. It was labelled 🔴 Gate for 132 runs and never once failed,
# because it cannot: it skips when its tools are absent, pipes findings through
# `|| true`, and carries continue-on-error. Two honest resolutions existed —
# make it able to fail, or stop calling it a gate. The second is correct here:
# panic-attack has a known false-positive problem (panic-attack#171), much of it
# firing on tests and benches rather than shipping code, so blocking merges on
# it would train people to bypass the gate. Advisory is what it actually is.
#
# It was also NOT in any ruleset despite the old header claiming otherwise, so
# renaming it cannot strand a required context.
# Runs panic-attack and hypatia, deposits findings for gitbot-fleet learning.
name: "🟡 CHECK: Static analysis"
on:
  pull_request:
    branches: ['**']
  push:
    branches: [main, master]
permissions:
  contents: read
jobs:
  # ---------------------------------------------------------------------------
  # Job 1: panic-attack assail
  # ---------------------------------------------------------------------------
  panic-attack-assail:
    name: panic-attack assail
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0
      - name: Install panic-attack v2.5.5 from pinned source
        id: install
        env:
          # v2.5.5 has a tag but no GitHub Release/assets. Build the exact
          # tagged commit with its lockfile instead of downloading a
          # non-existent v1.0.1 binary and silently skipping the scan.
          PANIC_ATTACK_REV: 2dc1393c0ac982dbad98ba07f78a580d319456a5
        run: |
          set -euo pipefail
          cargo install --git https://github.com/hyperpolymath/panic-attack.git \
            --rev "$PANIC_ATTACK_REV" --locked --bin panic-attack \
            --root "$RUNNER_TEMP/panic-attack"
          "$RUNNER_TEMP/panic-attack/bin/panic-attack" --version
          echo "$RUNNER_TEMP/panic-attack/bin" >> "$GITHUB_PATH"
          echo "installed=true" >> "$GITHUB_OUTPUT"
      - name: Run panic-attack assail
        id: assail
        if: steps.install.outputs.installed == 'true'
        run: |
          set +e
          panic-attack assail --format json . > panic-attack-findings.json
          PA_EXIT=$?
          set -e

          # Same defect class as the Hypatia job below: `2>&1` folded the
          # scanner's stderr into the JSON payload, so every jq parse failed,
          # every count silently became 0 via `|| echo 0`, and "Fail on critical
          # findings" could never fire on any input. Keep stderr on the log.
          if [ ! -s panic-attack-findings.json ]; then
            echo "[]" > panic-attack-findings.json
          fi

          # Deliberately a WARNING, not a failure. panic-attack is a downloaded
          # release binary whose exit-code and output contract are not verified
          # here, and it has no confirmed --exit-zero equivalent, so we surface a
          # malformed payload in the log rather than block on an unverified tool.
          # Promote to `exit 1` (as the Hypatia job does) once that contract is
          # confirmed -- see the follow-up issue linked from this PR.
          if ! jq -e 'type == "array"' panic-attack-findings.json >/dev/null 2>&1; then
            echo "::warning::panic-attack output is not a JSON array (exit ${PA_EXIT}); counts below are unreliable"
          fi

          # Parse finding counts
          TOTAL=$(jq '. | length' panic-attack-findings.json 2>/dev/null || echo 0)
          CRITICAL=$(jq '[.[] | select(.severity == "critical")] | length' panic-attack-findings.json 2>/dev/null || echo 0)
          HIGH=$(jq '[.[] | select(.severity == "high")] | length' panic-attack-findings.json 2>/dev/null || echo 0)
          MEDIUM=$(jq '[.[] | select(.severity == "medium")] | length' panic-attack-findings.json 2>/dev/null || echo 0)
          LOW=$(jq '[.[] | select(.severity == "low")] | length' panic-attack-findings.json 2>/dev/null || echo 0)

          echo "total=$TOTAL" >> "$GITHUB_OUTPUT"
          echo "critical=$CRITICAL" >> "$GITHUB_OUTPUT"
          echo "high=$HIGH" >> "$GITHUB_OUTPUT"
          echo "medium=$MEDIUM" >> "$GITHUB_OUTPUT"
          echo "low=$LOW" >> "$GITHUB_OUTPUT"
          echo "exit_code=$PA_EXIT" >> "$GITHUB_OUTPUT"
      - name: Emit check annotations
        if: steps.install.outputs.installed == 'true'
        run: |
          # Convert JSON findings into GitHub Actions annotations
          # Findings carry no `.message` (keys: action,file,line,reason,rule_module,
          # severity,type), so every annotation read "null". `.file` is an absolute
          # runner path, which GitHub cannot anchor to the diff, so it is made
          # workspace-relative here.
          jq -r --arg ws "$GITHUB_WORKSPACE" '.[] | select(.file != null) |
            (.file | ltrimstr($ws + "/")) as $f |
            (.reason // .message // .type // "finding") as $m |
            if .severity == "critical" then
              "::error file=\($f),line=\(.line // 1)::[panic-attack] \($m)"
            elif .severity == "high" then
              "::error file=\($f),line=\(.line // 1)::[panic-attack] \($m)"
            else
              "::warning file=\($f),line=\(.line // 1)::[panic-attack] \($m)"
            end
          ' panic-attack-findings.json || true
      - name: Write step summary
        if: steps.install.outputs.installed == 'true'
        env:
          STEPS_ASSAIL_OUTPUTS_CRITICAL: ${{ steps.assail.outputs.critical }}
          STEPS_ASSAIL_OUTPUTS_HIGH: ${{ steps.assail.outputs.high }}
          STEPS_ASSAIL_OUTPUTS_MEDIUM: ${{ steps.assail.outputs.medium }}
          STEPS_ASSAIL_OUTPUTS_LOW: ${{ steps.assail.outputs.low }}
          STEPS_ASSAIL_OUTPUTS_TOTAL: ${{ steps.assail.outputs.total }}
        run: |
          cat <<EOF >> "$GITHUB_STEP_SUMMARY"
          ## panic-attack assail Results

          | Severity | Count |
          |----------|-------|
          | Critical | $STEPS_ASSAIL_OUTPUTS_CRITICAL |
          | High     | $STEPS_ASSAIL_OUTPUTS_HIGH |
          | Medium   | $STEPS_ASSAIL_OUTPUTS_MEDIUM |
          | Low      | $STEPS_ASSAIL_OUTPUTS_LOW |
          | **Total**| $STEPS_ASSAIL_OUTPUTS_TOTAL |
          EOF
      - name: Upload panic-attack findings
        uses: actions/upload-artifact@v7.0.2
        with:
          name: panic-attack-findings
          path: panic-attack-findings.json
          retention-days: 90
      - name: Fail on critical findings
        if: steps.install.outputs.installed == 'true' && steps.assail.outputs.critical > 0
        env:
          STEPS_ASSAIL_OUTPUTS_CRITICAL: ${{ steps.assail.outputs.critical }}
        run: |
          echo "::error::panic-attack found $STEPS_ASSAIL_OUTPUTS_CRITICAL critical issue(s) — blocking merge"
          exit 1
  # ---------------------------------------------------------------------------
  # Job 2: hypatia-scan
  # ---------------------------------------------------------------------------
  hypatia-scan:
    name: Hypatia neurosymbolic scan
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0
      - name: Setup Elixir for Hypatia scanner
        id: beam
        continue-on-error: true
        uses: erlef/setup-beam@v1.24.1
        with:
          elixir-version: '1.19.4'
          otp-version: '28.3'
      - name: Clone and build Hypatia
        id: build
        continue-on-error: true
        run: |
          HYPATIA_REF="aa34a4cc6ba39d873710ff39763fdb9cde715f9d"
          if git clone https://github.com/hyperpolymath/hypatia.git "$HOME/hypatia" 2>/dev/null; then
            git -C "$HOME/hypatia" -c advice.detachedHead=false checkout "$HYPATIA_REF" 2>/dev/null \
              || { echo "::warning::could not pin hypatia to $HYPATIA_REF"; rm -rf "$HOME/hypatia"; }
          fi
          if [ -f "$HOME/hypatia/mix.exs" ]; then
            cd "$HOME/hypatia" || exit 1
            # Build escript if neither hypatia nor hypatia-v2 exists
            if [ ! -f hypatia ] && [ ! -f hypatia-v2 ]; then
              mix deps.get
              mix escript.build
            fi
            echo "ready=true" >> "$GITHUB_OUTPUT"
          else
            echo "::warning::Hypatia scanner NOT AVAILABLE — scan DID NOT RUN. Empty findings below mean \"not scanned\", not \"clean\"."
            echo "ready=false" >> "$GITHUB_OUTPUT"
          fi
      - name: Run Hypatia scan
        id: scan
        if: steps.build.outputs.ready == 'true'
        run: |
          set +e
          HYPATIA_FORMAT=json "$HOME/hypatia/hypatia-cli.sh" scan . --exit-zero > hypatia-findings.json
          HYP_EXIT=$?
          set -e

          # --exit-zero is Hypatia's own documented CI recipe (lib/hypatia/cli.ex),
          # for exactly this case: "use in CI when a downstream step gates on
          # severity counts". Findings go to stdout, the one-line summary to
          # stderr, and the process exits 0 unless the SCANNER itself failed.
          #
          # Do NOT redirect stderr into the payload with `2>&1`: that folds the
          # summary line into the JSON, so every parse fails, the old `[]`
          # fallback substituted a clean result, CRITICAL was always 0, and the
          # gate below could never fire on any input. Keep stderr on the log.
          if [ "$HYP_EXIT" -ne 0 ]; then
            echo "::error::Hypatia scanner execution failed with exit ${HYP_EXIT}"
            exit "$HYP_EXIT"
          fi
          # `jq empty` is NOT sufficient -- it succeeds on any valid JSON,
          # including a bare string, object or null. Assert the array.
          if [ ! -s hypatia-findings.json ] || ! jq -e 'type == "array"' hypatia-findings.json >/dev/null; then
            echo "::error::Hypatia did not produce a valid JSON findings array"
            exit 1
          fi

          TOTAL=$(jq '. | length' hypatia-findings.json 2>/dev/null || echo 0)
          CRITICAL=$(jq '[.[] | select(.severity == "critical")] | length' hypatia-findings.json 2>/dev/null || echo 0)
          HIGH=$(jq '[.[] | select(.severity == "high")] | length' hypatia-findings.json 2>/dev/null || echo 0)
          MEDIUM=$(jq '[.[] | select(.severity == "medium")] | length' hypatia-findings.json 2>/dev/null || echo 0)
          LOW=$(jq '[.[] | select(.severity == "low")] | length' hypatia-findings.json 2>/dev/null || echo 0)

          echo "total=$TOTAL" >> "$GITHUB_OUTPUT"
          echo "critical=$CRITICAL" >> "$GITHUB_OUTPUT"
          echo "high=$HIGH" >> "$GITHUB_OUTPUT"
          echo "medium=$MEDIUM" >> "$GITHUB_OUTPUT"
          echo "low=$LOW" >> "$GITHUB_OUTPUT"
      - name: Emit check annotations
        if: steps.build.outputs.ready == 'true'
        run: |
          # Findings carry no `.message` (keys: action,file,line,reason,rule_module,
          # severity,type), so every annotation read "null". `.file` is an absolute
          # runner path, which GitHub cannot anchor to the diff, so it is made
          # workspace-relative here.
          jq -r --arg ws "$GITHUB_WORKSPACE" '.[] | select(.file != null) |
            (.file | ltrimstr($ws + "/")) as $f |
            (.reason // .message // .type // "finding") as $m |
            if .severity == "critical" then
              "::error file=\($f),line=\(.line // 1)::[hypatia] \($m)"
            elif .severity == "high" then
              "::error file=\($f),line=\(.line // 1)::[hypatia] \($m)"
            else
              "::warning file=\($f),line=\(.line // 1)::[hypatia] \($m)"
            end
          ' hypatia-findings.json || true
      - name: Write step summary
        if: steps.build.outputs.ready == 'true'
        env:
          STEPS_SCAN_OUTPUTS_CRITICAL: ${{ steps.scan.outputs.critical }}
          STEPS_SCAN_OUTPUTS_HIGH: ${{ steps.scan.outputs.high }}
          STEPS_SCAN_OUTPUTS_MEDIUM: ${{ steps.scan.outputs.medium }}
          STEPS_SCAN_OUTPUTS_LOW: ${{ steps.scan.outputs.low }}
          STEPS_SCAN_OUTPUTS_TOTAL: ${{ steps.scan.outputs.total }}
        run: |
          cat <<EOF >> "$GITHUB_STEP_SUMMARY"
          ## Hypatia Scan Results

          | Severity | Count |
          |----------|-------|
          | Critical | $STEPS_SCAN_OUTPUTS_CRITICAL |
          | High     | $STEPS_SCAN_OUTPUTS_HIGH |
          | Medium   | $STEPS_SCAN_OUTPUTS_MEDIUM |
          | Low      | $STEPS_SCAN_OUTPUTS_LOW |
          | **Total**| $STEPS_SCAN_OUTPUTS_TOTAL |
          EOF
      - name: Create stub findings (when Hypatia unavailable)
        if: steps.build.outputs.ready != 'true'
        run: |
          echo "[]" > hypatia-findings.json
          echo "## Hypatia Scan" >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"
          echo "**DID NOT RUN** — the Hypatia scanner was not available in this environment. The empty result is absence of evidence, not evidence of absence." >> "$GITHUB_STEP_SUMMARY"
      - name: Upload hypatia findings
        uses: actions/upload-artifact@v7.0.2
        with:
          name: hypatia-findings
          path: hypatia-findings.json
          retention-days: 90
      - name: Fail on critical security findings
        if: steps.build.outputs.ready == 'true' && steps.scan.outputs.critical > 0
        env:
          STEPS_SCAN_OUTPUTS_CRITICAL: ${{ steps.scan.outputs.critical }}
        run: |
          echo "::error::Hypatia found $STEPS_SCAN_OUTPUTS_CRITICAL critical security issue(s) — blocking merge"
          exit 1
  # ---------------------------------------------------------------------------
  # Job 3: patch-bridge triage (CVE contextual assessment)
  # ---------------------------------------------------------------------------
  patch-bridge-triage:
    name: Patch Bridge CVE triage
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0
      - name: Install panic-attack v2.5.5 from pinned source
        id: install
        env:
          # v2.5.5 has a tag but no GitHub Release/assets. Build the exact
          # tagged commit with its lockfile instead of downloading a
          # non-existent v1.0.1 binary and silently skipping the scan.
          PANIC_ATTACK_REV: 2dc1393c0ac982dbad98ba07f78a580d319456a5
        run: |
          set -euo pipefail
          cargo install --git https://github.com/hyperpolymath/panic-attack.git \
            --rev "$PANIC_ATTACK_REV" --locked --bin panic-attack \
            --root "$RUNNER_TEMP/panic-attack"
          "$RUNNER_TEMP/panic-attack/bin/panic-attack" --version
          echo "$RUNNER_TEMP/panic-attack/bin" >> "$GITHUB_PATH"
          echo "installed=true" >> "$GITHUB_OUTPUT"
      - name: Run Patch Bridge triage
        id: triage
        if: steps.install.outputs.installed == 'true'
        run: |
          set +e
          panic-attack bridge triage --format json . > bridge-report.json 2>&1
          PB_EXIT=$?
          set -e

          echo "panic-attack bridge exit: ${PB_EXIT}"
          if [ "$PB_EXIT" -ne 0 ]; then
            echo "::warning::panic-attack bridge exited ${PB_EXIT}; payload will be replaced by the stub unless it is valid JSON"
          fi
          if [ ! -s bridge-report.json ] || ! jq empty bridge-report.json 2>/dev/null; then
            echo '{"cves":[],"mitigated":0,"unmitigable":0,"concatenative":0,"informational":0}' > bridge-report.json
          fi

          UNMITIGABLE=$(jq '.unmitigable // 0' bridge-report.json)
          MITIGATED=$(jq '.mitigated // 0' bridge-report.json)
          CONCATENATIVE=$(jq '.concatenative // 0' bridge-report.json)
          INFORMATIONAL=$(jq '.informational // 0' bridge-report.json)

          echo "unmitigable=$UNMITIGABLE" >> "$GITHUB_OUTPUT"
          echo "mitigated=$MITIGATED" >> "$GITHUB_OUTPUT"
          echo "concatenative=$CONCATENATIVE" >> "$GITHUB_OUTPUT"
          echo "informational=$INFORMATIONAL" >> "$GITHUB_OUTPUT"
      - name: Write step summary
        if: steps.install.outputs.installed == 'true'
        env:
          STEPS_TRIAGE_OUTPUTS_UNMITIGABLE: ${{ steps.triage.outputs.unmitigable }}
          STEPS_TRIAGE_OUTPUTS_MITIGATED: ${{ steps.triage.outputs.mitigated }}
          STEPS_TRIAGE_OUTPUTS_CONCATENATIVE: ${{ steps.triage.outputs.concatenative }}
          STEPS_TRIAGE_OUTPUTS_INFORMATIONAL: ${{ steps.triage.outputs.informational }}
        run: |
          cat <<EOF >> "$GITHUB_STEP_SUMMARY"
          ## Patch Bridge CVE Triage

          | Classification | Count |
          |----------------|-------|
          | Unmitigable    | $STEPS_TRIAGE_OUTPUTS_UNMITIGABLE |
          | Mitigated      | $STEPS_TRIAGE_OUTPUTS_MITIGATED |
          | Concatenative  | $STEPS_TRIAGE_OUTPUTS_CONCATENATIVE |
          | Informational  | $STEPS_TRIAGE_OUTPUTS_INFORMATIONAL |

          Unmitigable CVEs require dependency replacement or rearchitecture.
          Mitigated CVEs have active controls with soundness proofs.
          Concatenative risks are CVE combinations that multiply severity.
          EOF
      - name: Upload bridge report
        uses: actions/upload-artifact@v7.0.2
        with:
          name: bridge-report
          path: bridge-report.json
          retention-days: 90
      - name: Fail on unmitigable CVEs in critical paths
        if: steps.install.outputs.installed == 'true' && steps.triage.outputs.unmitigable > 0
        env:
          STEPS_TRIAGE_OUTPUTS_UNMITIGABLE: ${{ steps.triage.outputs.unmitigable }}
        run: |
          echo "::warning::Patch Bridge found $STEPS_TRIAGE_OUTPUTS_UNMITIGABLE unmitigable CVE(s) — review required"
          # Warning only, not blocking. Unmitigable means the developer needs
          # to make an architectural decision, not that the PR is wrong.
  # ---------------------------------------------------------------------------
  # Job 4: deposit-findings (combines + archives for gitbot-fleet)
  # ---------------------------------------------------------------------------
  deposit-findings:
    name: Deposit findings for gitbot-fleet
    runs-on: ubuntu-latest
    timeout-minutes: 15
    needs: [panic-attack-assail, hypatia-scan, patch-bridge-triage]
    if: always()
    steps:
      - name: Download panic-attack findings
        uses: actions/download-artifact@v8.0.2
        with:
          name: panic-attack-findings
          path: findings/
      - name: Download hypatia findings
        uses: actions/download-artifact@v8.0.2
        with:
          name: hypatia-findings
          path: findings/
      - name: Download bridge report
        uses: actions/download-artifact@v8.0.2
        with:
          name: bridge-report
          path: findings/
      - name: Combine findings into unified report
        id: combine
        env:
          GITHUB_REPOSITORY: ${{ github.repository }}
          GITHUB_SHA: ${{ github.sha }}
          GITHUB_REF: ${{ github.ref }}
          GITHUB_RUN_ID: ${{ github.run_id }}
        run: |
          PA_FILE="findings/panic-attack-findings.json"
          HYP_FILE="findings/hypatia-findings.json"

          # Ensure both files exist and are valid JSON arrays
          for f in "$PA_FILE" "$HYP_FILE"; do
            if [ ! -s "$f" ] || ! jq empty "$f" 2>/dev/null; then
              echo "[]" > "$f"
            fi
          done

          # Tag each finding with its source scanner
          jq '[.[] | . + {"scanner": "panic-attack"}]' "$PA_FILE" > /tmp/pa-tagged.json
          jq '[.[] | . + {"scanner": "hypatia"}]'      "$HYP_FILE" > /tmp/hyp-tagged.json

          # Read bridge report (CVE triage, not findings array)
          BRIDGE_FILE="findings/bridge-report.json"
          if [ ! -s "$BRIDGE_FILE" ] || ! jq empty "$BRIDGE_FILE" 2>/dev/null; then
            echo '{"cves":[],"mitigated":0,"unmitigable":0,"concatenative":0,"informational":0}' > "$BRIDGE_FILE"
          fi

          # Build unified report envelope
          jq -n \
            --arg repo   "$GITHUB_REPOSITORY" \
            --arg sha    "$GITHUB_SHA" \
            --arg ref    "$GITHUB_REF" \
            --arg run_id "$GITHUB_RUN_ID" \
            --arg ts     "$(date -u +%Y-%m-%dT%H:%M:%SZ)" \
            --slurpfile pa     /tmp/pa-tagged.json \
            --slurpfile hyp    /tmp/hyp-tagged.json \
            --slurpfile bridge "$BRIDGE_FILE" \
            '{
              schema_version: "1.1.0",
              repository: $repo,
              commit_sha: $sha,
              ref: $ref,
              run_id: $run_id,
              timestamp: $ts,
              findings: ($pa[0] + $hyp[0]),
              patch_bridge: $bridge[0]
            }' > findings/unified-findings.json

          TOTAL=$(jq '.findings | length' findings/unified-findings.json)
          CRITICAL=$(jq '[.findings[] | select(.severity == "critical")] | length' findings/unified-findings.json)
          HIGH=$(jq '[.findings[] | select(.severity == "high")] | length' findings/unified-findings.json)
          MEDIUM=$(jq '[.findings[] | select(.severity == "medium")] | length' findings/unified-findings.json)
          LOW=$(jq '[.findings[] | select(.severity == "low")] | length' findings/unified-findings.json)

          echo "total=$TOTAL"       >> "$GITHUB_OUTPUT"
          echo "critical=$CRITICAL" >> "$GITHUB_OUTPUT"
          echo "high=$HIGH"         >> "$GITHUB_OUTPUT"
          echo "medium=$MEDIUM"     >> "$GITHUB_OUTPUT"
          echo "low=$LOW"           >> "$GITHUB_OUTPUT"
      - name: Upload unified findings (fleet scanner picks these up)
        uses: actions/upload-artifact@v7.0.2
        with:
          name: unified-findings
          path: findings/unified-findings.json
          retention-days: 90
      - name: Write deposit summary
        env:
          GITHUB_REPOSITORY: ${{ github.repository }}
          GITHUB_SHA: ${{ github.sha }}
          STEPS_COMBINE_OUTPUTS_CRITICAL: ${{ steps.combine.outputs.critical }}
          STEPS_COMBINE_OUTPUTS_HIGH: ${{ steps.combine.outputs.high }}
          STEPS_COMBINE_OUTPUTS_MEDIUM: ${{ steps.combine.outputs.medium }}
          STEPS_COMBINE_OUTPUTS_LOW: ${{ steps.combine.outputs.low }}
          STEPS_COMBINE_OUTPUTS_TOTAL: ${{ steps.combine.outputs.total }}
        run: |
          cat <<EOF >> "$GITHUB_STEP_SUMMARY"
          ## Unified Findings Deposit

          **Repository:** $GITHUB_REPOSITORY
          **Commit:** \`$GITHUB_SHA\`
          **Deposited at:** $(date -u +"%Y-%m-%d %H:%M:%S UTC")

          | Severity | Count |
          |----------|-------|
          | Critical | $STEPS_COMBINE_OUTPUTS_CRITICAL |
          | High     | $STEPS_COMBINE_OUTPUTS_HIGH |
          | Medium   | $STEPS_COMBINE_OUTPUTS_MEDIUM |
          | Low      | $STEPS_COMBINE_OUTPUTS_LOW |
          | **Total**| $STEPS_COMBINE_OUTPUTS_TOTAL |

          Findings saved as \`unified-findings\` artifact.
          The gitbot-fleet scanner will ingest these on its next pass.
          EOF
