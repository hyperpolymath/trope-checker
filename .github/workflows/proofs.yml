#
# The formal developments, enforced.
#
# ~4.1k lines of Lean 4 and Agda underwrite this repository's strongest claims —
# the grade-algebra cancellation boundary (Lean, ADR 0003 "ground truth") and
# Theorem B, the calculus metatheory (Agda, --safe --without-K). Until now none
# of it ran in CI: `just verify-all`, `just build-lean` and `just build-agda`
# were local recipes only, so the claims were asserted rather than measured.
# By this estate's own doctrine an unenforced proof claim is a fake gate.
#
# The `lake build` hole named when this workflow landed is now CLOSED. The open
# question was whether Mathlib could be made tractable in CI; it can. Measured
# locally on the pinned toolchain (Lean v4.16.0):
#   lake exe cache get   6014 files unpacked, "Completed successfully!", 8m56s
#   lake build           all 5 libraries, exit 0, "Build completed successfully."
# and the emitted `#print axioms` lines showed propext / Quot.sound /
# Classical.choice only — no sorryAx anywhere.
name: "🔴 Gate: Formal proofs"

on:
  push:
    paths:
      - 'verification/proofs/lean4/**'
      - 'verification/proofs/agda/**'
      - '.github/workflows/proofs.yml'
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  # Pure grep over the Lean sources: no toolchain, seconds to run, and it is the
  # gate that makes "sorry-free" checkable rather than merely stated. Mirrors the
  # `verify-all` recipe in build/just/proofs.just — keep the two in step.
  lean-source-honesty:
    name: "Lean sources: no sorry / admit / native_decide / user axiom"
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7.0.1
      - name: Gate the Lean sources
        shell: bash
        run: |
          set -euo pipefail
          fail=0
          # Every Lean source, not only the two v0.1 files: the ratified-carrier
          # results (GradeRatified, L4Monotonicity, TierTwoComplete, EffectAtoms,
          # GradeFactorisationR) are what the current spec cites.
          for f in $(git ls-files 'verification/proofs/lean4/*.lean' 'verification/proofs/lean4/*/*.lean'); do
            if [ ! -f "$f" ]; then
              echo "::error::gated file is missing: $f"; fail=1; continue
            fi
            echo "--- gating $f ---"
            # Comment-aware and token-based: strip -- and /- -/ comments first
            # (tests/lib/strip-proof-comments.awk; line numbers preserved), then match
            # the bare tokens, so `:= by` with an indented `sorry` on the NEXT line is
            # caught while the honest "sorry-free" prose in comments is not.
            stripped=$(awk -f tests/lib/strip-proof-comments.awk "$f")
            if grep -nE '(^|[^[:alnum:]_.])(sorry|admit)([^[:alnum:]_]|$)|\bnative_decide\b' <<<"$stripped"; then
              echo "::error file=$f::forbidden Lean tactic (sorry/admit/native_decide)"; fail=1
            fi
            if grep -nE '^[[:space:]]*axiom\b' <<<"$stripped"; then
              echo "::error file=$f::user axiom declared"; fail=1
            fi
          done
          [ "$fail" -eq 0 ] || exit 1
          echo "PASS: Lean sources are sorry/admit/native_decide-free and declare no user axioms"

  # Theorem B, the calculus metatheory. --safe rejects postulates by construction,
  # so this is a real check of postulate-freedom and not a word-grep (a grep would
  # false-positive on the honest "postulate-free" prose in the comments).
  #
  # TOOLCHAIN: pinned release artefacts, not the runner's apt. ubuntu-latest is
  # 24.04, whose agda-stdlib is 1.7.3; Theorem B imports Data.Product.Base, which
  # exists from stdlib 2.0, so `apt-get install agda agda-stdlib` there fails at
  # scope checking (exit 42) — reproduced 2026-10-13. The job now fetches the
  # Agda 2.7.0.1 release binary and the stdlib v2.0 source archive, verifies
  # both SHA-256 sums, and registers the stdlib under the name the .agda-lib
  # depends on. Verified 2026-10-13 with exactly these artefacts: All.agda and
  # Smoke.agda typecheck under --safe --without-K, exit 0 (~100 s). A checksum
  # mismatch fails loudly rather than silently testing a different stdlib.
  agda-theorem-b:
    name: "Agda Theorem B (--safe --without-K)"
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7.0.1
      - name: Install Agda 2.7.0.1 and agda-stdlib 2.0 (pinned, checksummed)
        shell: bash
        env:
          AGDA_URL: https://github.com/agda/agda/releases/download/v2.7.0.1/Agda-v2.7.0.1-linux.tar.xz
          AGDA_SHA256: 975b515a14877ab6bce5bfc641e16c4a3ee52ca5d7f846577dee80aa2145db8a
          STDLIB_URL: https://github.com/agda/agda-stdlib/archive/refs/tags/v2.0.tar.gz
          STDLIB_SHA256: 14eecb83d62495f701e1eb03ffba59a2f767491f728a8ab8c8bb9243331399d8
        run: |
          set -euo pipefail
          mkdir -p "${RUNNER_TEMP}/agda-toolchain" && cd "${RUNNER_TEMP}/agda-toolchain"
          curl -sSL -o agda.tar.xz "$AGDA_URL"
          echo "$AGDA_SHA256  agda.tar.xz" | sha256sum -c -
          curl -sSL -o stdlib.tar.gz "$STDLIB_URL"
          echo "$STDLIB_SHA256  stdlib.tar.gz" | sha256sum -c -
          tar -xJf agda.tar.xz && tar -xzf stdlib.tar.gz
          # theorem-b.agda-lib depends on `standard-library`; the 2.0 archive names
          # itself `standard-library-2.0`, so register a lib file under the depended-on name.
          printf 'name: standard-library\ninclude: src\nflags:\n  --warning=noUnsupportedIndexedMatch\n' \
            > agda-stdlib-2.0/standard-library.agda-lib
          mkdir -p "${RUNNER_TEMP}/agda-dir"
          echo "$PWD/agda-stdlib-2.0/standard-library.agda-lib" > "${RUNNER_TEMP}/agda-dir/libraries"
          {
            echo "AGDA_DIR=${RUNNER_TEMP}/agda-dir"
            echo "Agda_datadir=$PWD/Agda-v2.7.0.1/data"
            echo "LC_ALL=C.UTF-8"
          } >> "$GITHUB_ENV"
          echo "$PWD/Agda-v2.7.0.1/bin" >> "$GITHUB_PATH"
          "$PWD/Agda-v2.7.0.1/bin/agda" --version
      - name: Typecheck Theorem B
        shell: bash
        working-directory: verification/proofs/agda/theorem-b
        run: |
          set -euo pipefail
          agda --safe --without-K All.agda
          agda --safe --without-K Smoke.agda
          echo "PASS: All.agda + Smoke.agda typecheck (--safe => postulate-free by construction)"

  # The Lean developments actually built. `lean-source-honesty` above is a cheap
  # syntactic guard that runs in seconds on every push; this is the semantic one,
  # and it is what makes ADR 0003's "grade-algebra ground truth" a measured claim
  # rather than an asserted one.
  #
  # nanoda-allow-sorry: false makes an EXTERNAL type checker reject sorryAx, so a
  # proof cannot be admitted by a `sorry` that the grep above happens to miss
  # (e.g. one introduced through an import rather than written inline).
  lean-build:
    name: "Lean ${{ matrix.pkg }}: lake build + sorry-free environment"
    runs-on: ubuntu-latest
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        # grade-factorisation imports grade-boundary; both are built.
        pkg: [grade-boundary, grade-factorisation]
    steps:
      - uses: actions/checkout@v7.0.1
      - name: Build ${{ matrix.pkg }} and check the environment
        uses: leanprover/lean-action@v1.6.2
        with:
          lake-package-directory: verification/proofs/lean4/${{ matrix.pkg }}
          build: true
          use-mathlib-cache: true
          use-github-cache: true
          nanoda: true
          nanoda-allow-sorry: false
