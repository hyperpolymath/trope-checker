#
# dogfood-gate.yml — Hyperpolymath Dogfooding Quality Gate
# Validates that the repo uses hyperpolymath's own formats and tools.
# Companion to static-analysis-gate.yml (security) — this is for format compliance.
name: "🟡 Check: RSR self-use (dogfooding)"

on:
  pull_request:
    branches: ['**']
  push:
    branches: [main, master]

permissions:
  contents: read

jobs:
  # ---------------------------------------------------------------------------
  # Job 1: repo deed validation (job key kept so the check context is unchanged)
  # ---------------------------------------------------------------------------
  a2ml-validate:
    name: Validate DEED manifests
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false

      - name: Check for the repo deed
        id: detect
        run: |
          COUNT=$(find . -name '*.deed' -not -path './.git/*' | wc -l)
          echo "count=$COUNT" >> "$GITHUB_OUTPUT"
          if [ "$COUNT" -eq 0 ]; then
            echo "::error::No repo deed found. Every RSR repo carries <reponame>_chora.deed at its root"
            exit 1
          fi

      - name: Validate the repo deed (strict)
        if: steps.detect.outputs.count > 0
        env:
          INPUT_STRICT: "true"
        run: bash .githooks/validate-a2ml.sh
      - name: Write summary
        env:
          STEPS_DETECT_OUTPUTS_COUNT: ${{ steps.detect.outputs.count }}
        run: |
          DEED_COUNT="$STEPS_DETECT_OUTPUTS_COUNT"
          if [ "$DEED_COUNT" -eq 0 ]; then
            cat <<'EOF' >> "$GITHUB_STEP_SUMMARY"
          ## Repo deed validation

          :x: **No repo deed found.** Every RSR-compliant repo should have a repo deed (`<reponame>_chora.deed`) at its root.

          Copy one from [rsr-template-repo](https://github.com/hyperpolymath/rsr-template-repo).
          EOF
          else
            {
              echo "## Repo deed validation"
              echo ""
              echo "Scanned **${DEED_COUNT}** deed file(s). See step output for details."
            } >> "$GITHUB_STEP_SUMMARY"
          fi

  # ---------------------------------------------------------------------------
  # Job 2: K9 contract validation
  # ---------------------------------------------------------------------------
  k9-validate:
    name: Validate K9 contracts
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false

      - name: Check for K9 files
        id: detect
        run: |
          COUNT=$(find . \( -name '*.k9' -o -name '*.k9.ncl' \) -not -path './.git/*' | wc -l)
          CONFIG_COUNT=$(find . \( -name '*.toml' -o -name '*.yaml' -o -name '*.yml' -o -name '*.json' \) \
            -not -path './.git/*' -not -path './node_modules/*' -not -path './.deno/*' \
            -not -name 'package-lock.json' -not -name 'Cargo.lock' -not -name 'deno.lock' | wc -l)
          {
            echo "k9_count=$COUNT"
            echo "config_count=$CONFIG_COUNT"
          } >> "$GITHUB_OUTPUT"
          if [ "$COUNT" -eq 0 ] && [ "$CONFIG_COUNT" -gt 0 ]; then
            echo "::warning::Found $CONFIG_COUNT config files but no K9 contracts. Run k9iser to generate contracts."
          fi

      - name: Validate K9 contracts
        if: steps.detect.outputs.k9_count > 0
        run: bash .githooks/validate-k9.sh
      - name: Write summary
        env:
          STEPS_DETECT_OUTPUTS_K9_COUNT: ${{ steps.detect.outputs.k9_count }}
          STEPS_DETECT_OUTPUTS_CONFIG_COUNT: ${{ steps.detect.outputs.config_count }}
        run: |
          K9_COUNT="$STEPS_DETECT_OUTPUTS_K9_COUNT"
          CFG_COUNT="$STEPS_DETECT_OUTPUTS_CONFIG_COUNT"
          if [ "$K9_COUNT" -eq 0 ]; then
            cat <<'EOF' >> "$GITHUB_STEP_SUMMARY"
          ## K9 Contract Validation

          :warning: **No K9 contracts found.**

          Generate contracts with: `k9iser generate .`
          EOF
          else
            {
              echo "## K9 Contract Validation"
              echo ""
              echo "Validated **${K9_COUNT}** K9 contract(s) against **${CFG_COUNT}** config file(s)."
            } >> "$GITHUB_STEP_SUMMARY"
          fi

  # ---------------------------------------------------------------------------
  # Job 3: Empty-linter — invisible character detection
  # ---------------------------------------------------------------------------
  empty-lint:
    name: Empty-linter (invisible characters)
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false

      - name: Scan for invisible characters
        id: lint
        run: |
          # Inline invisible character detection (from empty-linter's core patterns).
          # Checks for: zero-width spaces, zero-width joiners, BOM, soft hyphens,
          # non-breaking spaces, null bytes, and other invisible Unicode in source files.
          set +e
          PATTERNS='(*UTF)[\x00-\x08\x0B\x0C\x0E-\x1F\x{a0}\x{ad}\x{200b}-\x{200f}\x{202a}-\x{202f}\x{2060}\x{2066}-\x{2069}\x{feff}]'
          find "$GITHUB_WORKSPACE" \
            -not -path '*/.git/*' -not -path '*/node_modules/*' \
            -not -path '*/.deno/*' -not -path '*/target/*' \
            -not -path '*/_build/*' -not -path '*/deps/*' \
            -not -path '*/external_corpora/*' -not -path '*/.lake/*' \
            -type f \( -name '*.rs' -o -name '*.ex' -o -name '*.exs' -o -name '*.res' \
              -o -name '*.js' -o -name '*.ts' -o -name '*.json' -o -name '*.toml' \
              -o -name '*.yml' -o -name '*.yaml' -o -name '*.md' -o -name '*.adoc' \
              -o -name '*.idr' -o -name '*.zig' -o -name '*.v' -o -name '*.jl' \
              -o -name '*.gleam' -o -name '*.hs' -o -name '*.ml' -o -name '*.sh' \) \
            -exec grep -aPrl "$PATTERNS" {} \; > /tmp/empty-lint-results.txt 2>/dev/null
          EL_EXIT=$?
          set -e

          FINDINGS=$(wc -l < /tmp/empty-lint-results.txt 2>/dev/null || echo 0)
          {
            echo "findings=$FINDINGS"
            echo "exit_code=$EL_EXIT"
            echo "ready=true"
          } >> "$GITHUB_OUTPUT"

          # Emit annotations for each file with invisible chars
          while IFS= read -r filepath; do
            [ -z "$filepath" ] && continue
            REL_PATH="${filepath#"$GITHUB_WORKSPACE"/}"
            echo "::warning file=${REL_PATH}::Invisible Unicode characters detected (zero-width space, BOM, NBSP, etc.)"
          done < /tmp/empty-lint-results.txt

      - name: Write summary
        env:
          STEPS_LINT_OUTPUTS_READY: ${{ steps.lint.outputs.ready }}
          STEPS_LINT_OUTPUTS_FINDINGS: ${{ steps.lint.outputs.findings }}
        run: |
          if [ "$STEPS_LINT_OUTPUTS_READY" = "true" ]; then
            FINDINGS="$STEPS_LINT_OUTPUTS_FINDINGS"
            if [ "$FINDINGS" -gt 0 ] 2>/dev/null; then
              {
                echo "## Empty-Linter Results"
                echo ""
                echo "Found **${FINDINGS}** invisible character issue(s). See annotations above."
              } >> "$GITHUB_STEP_SUMMARY"
            else
              {
                echo "## Empty-Linter Results"
                echo ""
                echo ":white_check_mark: No invisible character issues found."
              } >> "$GITHUB_STEP_SUMMARY"
            fi
          else
            {
              echo "## Empty-Linter"
              echo ""
              echo "Skipped: empty-linter not available."
            } >> "$GITHUB_STEP_SUMMARY"
          fi

  # ---------------------------------------------------------------------------
  # Job 4: Groove manifest check (for repos that should expose services)
  # ---------------------------------------------------------------------------
  groove-check:
    name: Groove manifest check
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false

      - name: Check for Groove manifest
        id: groove
        run: |
          # Check for static or dynamic Groove endpoints
          HAS_MANIFEST="false"
          HAS_GROOVE_CODE="false"

          if [ -f ".well-known/groove/manifest.json" ]; then
            HAS_MANIFEST="true"
            # Validate the manifest JSON
            if ! jq empty .well-known/groove/manifest.json 2>/dev/null; then
              echo "::error file=.well-known/groove/manifest.json::Invalid JSON in Groove manifest"
            else
              SVC_ID=$(jq -r '.service_id // "unknown"' .well-known/groove/manifest.json)
              echo "service_id=$SVC_ID" >> "$GITHUB_OUTPUT"
            fi
          fi

          # Check for Groove endpoint code (Rust, Elixir, Zig, V)
          if grep -rl 'well-known/groove' --include='*.rs' --include='*.ex' --include='*.zig' --include='*.v' --include='*.res' . 2>/dev/null | head -1 | grep -q .; then
            HAS_GROOVE_CODE="true"
          fi

          # Check if this repo likely serves HTTP (has server/listener code)
          HAS_SERVER="false"
          if grep -rl 'TcpListener\|Bandit\|Plug.Cowboy\|httpz\|vweb\|axum::serve\|actix_web' --include='*.rs' --include='*.ex' --include='*.zig' --include='*.v' . 2>/dev/null | head -1 | grep -q .; then
            HAS_SERVER="true"
          fi

          {
            echo "has_manifest=$HAS_MANIFEST"
            echo "has_groove_code=$HAS_GROOVE_CODE"
            echo "has_server=$HAS_SERVER"
          } >> "$GITHUB_OUTPUT"

          if [ "$HAS_SERVER" = "true" ] && [ "$HAS_MANIFEST" = "false" ] && [ "$HAS_GROOVE_CODE" = "false" ]; then
            echo "::warning::This repo has server code but no Groove endpoint. Add .well-known/groove/manifest.json for service discovery."
          fi

      - name: Write summary
        env:
          STEPS_GROOVE_OUTPUTS_HAS_MANIFEST: ${{ steps.groove.outputs.has_manifest }}
          STEPS_GROOVE_OUTPUTS_HAS_GROOVE_CODE: ${{ steps.groove.outputs.has_groove_code }}
          STEPS_GROOVE_OUTPUTS_HAS_SERVER: ${{ steps.groove.outputs.has_server }}
        run: |
          {
            echo "## Groove Protocol Check"
            echo ""
            echo "| Check | Status |"
            echo "|-------|--------|"
            echo "| Static manifest (.well-known/groove/manifest.json) | $STEPS_GROOVE_OUTPUTS_HAS_MANIFEST |"
            echo "| Groove endpoint in code | $STEPS_GROOVE_OUTPUTS_HAS_GROOVE_CODE |"
            echo "| Has HTTP server code | $STEPS_GROOVE_OUTPUTS_HAS_SERVER |"
          } >> "$GITHUB_STEP_SUMMARY"

  # ---------------------------------------------------------------------------
  # Job 5: eclexiaiser manifest validation
  # ---------------------------------------------------------------------------
  eclexiaiser-validate:
    name: Validate eclexiaiser manifest
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false

      - name: Check and validate eclexiaiser manifest
        id: eclex
        run: |
          if [ ! -f "eclexiaiser.toml" ]; then
            # Check if repo has a Containerfile — if so, recommend eclexiaiser
            if [ -f "Containerfile" ]; then
              echo "::warning::Containerfile present but no eclexiaiser.toml. Run \`eclexiaiser init\` to scaffold energy/carbon budgets."
            fi
            echo "has_manifest=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          echo "has_manifest=true" >> "$GITHUB_OUTPUT"

          # Validate eclexiaiser.toml structure (bash + grep; no Python — estate no-Python rule).
          ok=1
          grep -qE '^[[:space:]]*name[[:space:]]*=[[:space:]]*"[^"]+"' eclexiaiser.toml || { echo "::error::project.name is required"; ok=0; }
          nfun=$(grep -cE '^[[:space:]]*\[\[functions\]\]' eclexiaiser.toml || true)
          [ "${nfun:-0}" -ge 1 ] || { echo "::error::at least one [[functions]] entry is required"; ok=0; }
          nname=$(grep -cE '^[[:space:]]*name[[:space:]]*=[[:space:]]*"[^"]+"' eclexiaiser.toml || true)
          nsrc=$(grep -cE '^[[:space:]]*source[[:space:]]*=[[:space:]]*"[^"]+"' eclexiaiser.toml || true)
          [ "${nname:-0}" -ge "$(( ${nfun:-0} + 1 ))" ] || { echo "::error::a function has an empty or missing name"; ok=0; }
          [ "${nsrc:-0}" -ge "${nfun:-0}" ] || { echo "::error::a function has an empty or missing source"; ok=0; }
          if [ "$ok" = 1 ]; then echo "Valid: eclexiaiser.toml (${nfun:-0} function(s))"; else echo "::error file=eclexiaiser.toml::Invalid eclexiaiser.toml"; exit 1; fi

      - name: Write summary
        env:
          STEPS_ECLEX_OUTPUTS_HAS_MANIFEST: ${{ steps.eclex.outputs.has_manifest }}
        run: |
          if [ "$STEPS_ECLEX_OUTPUTS_HAS_MANIFEST" = "true" ]; then
            {
              echo "## Eclexiaiser Manifest"
              echo ""
              echo ":white_check_mark: **eclexiaiser.toml** present and valid."
            } >> "$GITHUB_STEP_SUMMARY"
          else
            {
              echo "## Eclexiaiser Manifest"
              echo ""
              echo ":ballot_box_with_check: No eclexiaiser.toml. Add one with \`eclexiaiser init\` for energy/carbon tracking."
            } >> "$GITHUB_STEP_SUMMARY"
          fi

  # ---------------------------------------------------------------------------
  # Job 6: Dogfooding summary
  # ---------------------------------------------------------------------------
  dogfood-summary:
    name: Dogfooding compliance summary
    runs-on: ubuntu-latest
    timeout-minutes: 15
    needs: [a2ml-validate, k9-validate, empty-lint, groove-check, eclexiaiser-validate]
    if: always()

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false

      - name: Generate dogfooding scorecard
        run: |
          SCORE=0
          MAX=6

          # Repo deed present?
          if find . -maxdepth 1 -name '*_chora.deed' | head -1 | grep -q .; then
            SCORE=$((SCORE + 1))
            DEED_STATUS=":white_check_mark:"
          else
            DEED_STATUS=":x:"
          fi

          # K9 contracts present?
          if find . \( -name '*.k9' -o -name '*.k9.ncl' \) -not -path './.git/*' | head -1 | grep -q .; then
            SCORE=$((SCORE + 1))
            K9_STATUS=":white_check_mark:"
          else
            K9_STATUS=":x:"
          fi

          # .editorconfig present?
          if [ -f ".editorconfig" ]; then
            SCORE=$((SCORE + 1))
            EC_STATUS=":white_check_mark:"
          else
            EC_STATUS=":x:"
          fi

          # Groove manifest or code?
          if [ -f ".well-known/groove/manifest.json" ] || grep -rl 'well-known/groove' --include='*.rs' --include='*.ex' --include='*.zig' . 2>/dev/null | head -1 | grep -q .; then
            SCORE=$((SCORE + 1))
            GROOVE_STATUS=":white_check_mark:"
          else
            GROOVE_STATUS=":ballot_box_with_check:"
          fi

          # VeriSimDB integration?
          if grep -rl 'verisimdb\|VeriSimDB' --include='*.toml' --include='*.yaml' --include='*.yml' --include='*.json' --include='*.rs' --include='*.ex' . 2>/dev/null | head -1 | grep -q .; then
            SCORE=$((SCORE + 1))
            VSDB_STATUS=":white_check_mark:"
          else
            VSDB_STATUS=":ballot_box_with_check:"
          fi

          # eclexiaiser energy tracking?
          if [ -f "eclexiaiser.toml" ]; then
            SCORE=$((SCORE + 1))
            ECLEX_STATUS=":white_check_mark:"
          else
            ECLEX_STATUS=":ballot_box_with_check:"
          fi

          cat <<EOF >> "$GITHUB_STEP_SUMMARY"
          ## Dogfooding Scorecard

          **Score: ${SCORE}/${MAX}**

          | Tool/Format | Status | Notes |
          |-------------|--------|-------|
          | DEED repo deed (\`<reponame>_chora.deed\`) | ${DEED_STATUS} | Required for all RSR repos |
          | K9 contracts | ${K9_STATUS} | Required for repos with config files |
          | .editorconfig | ${EC_STATUS} | Required for all repos |
          | Groove endpoint | ${GROOVE_STATUS} | Required for service repos |
          | VeriSimDB integration | ${VSDB_STATUS} | Required for stateful repos |
          | eclexiaiser | ${ECLEX_STATUS} | Energy/carbon budgets for container services |

          ---
          *Generated by the [Dogfood Gate](https://github.com/hyperpolymath/rsr-template-repo) workflow.*
          *Dogfooding is guinea pig fooding — we test our tools on ourselves.*
          EOF
