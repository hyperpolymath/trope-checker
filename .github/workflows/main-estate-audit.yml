# SPDX-License-Identifier: MPL-2.0
# This workflow is managed by gh actions-lock.
#
# Central Estate CI/CD Audit — a THIN CALLER of the shared estate audit.
#
# This file used to be an expanded copy of the audit: one job of 26 steps, each
# a direct `uses:` of a hyperpolymath/cicd-suite composite. A copy freezes the
# repository at whatever suite commit its actions.lock happened to hold, so
# upstream fixes never arrive, and it had drifted four ways:
#
#   * It still ran `prat-check` and `semantic-audit-check`, which upstream
#     removed as stubs that passed unconditionally (README, known defect 5:
#     a green tick that credited assurance nothing checked).
#   * It still ran `contractile-validation-check` and `proof-runner-check`,
#     removed upstream for pass-on-absence (known defect 7): each printed
#     "passed" when the tool it exists to run was absent — the normal case on
#     a hosted runner — so they could only ever certify scans that never ran.
#   * One job stopped at its first failing gate, so a single red hid the other
#     25 and every failure read "estate-audit: failing after 8s" with no gate
#     named. The shared workflow reports five component checks (governance,
#     hygiene, manifests, languages, advisory), each gate its own step, and
#     keeps running the remaining gates after one fails.
#   * Every step named `hyperpolymath/cicd-suite`, the suite's PRE-RENAME
#     coordinate. Measured on this branch (runs 42603702962 / 42603704212,
#     2026-11-09): a reusable-workflow call under the old name starts with ZERO
#     jobs and reports only "failure", while the same pin under the canonical
#     name starts all five component checks. Resolving the old coordinate via
#     the API still succeeds because REST follows the transfer redirect — the
#     redirect is exactly what made the failure invisible. This repository's
#     own workflow-linter re-resolution step flags it 24 times.
#
# So the audit is called, not copied:
#
#   * Pin is a full branch-reachable commit SHA on the suite's default branch
#     (2026-11-09 main). Never `@main` or a tag: the account enforces
#     sha_pinning_required, and a branch ref would change the gates in every
#     consuming repository at once. Never a blob SHA.
#   * Caller job id stays `estate-audit`, and the workflow name is unchanged,
#     so the required context keeps the prefix it had. The component checks
#     report as `estate-audit / governance`, `estate-audit / hygiene`,
#     `estate-audit / manifests`, `estate-audit / languages`,
#     `estate-audit / advisory`.
#   * DE-ONBOARDED from actions.lock: this file's entry lists no step-level
#     action refs (the reusable call is a job-level `uses:`, which
#     gh actions-lock does not track). An onboarded cross-repo reusable call
#     under sha_pinning_required is the zero-job startup failure measured
#     above. Regenerate the lock with `gh actions-lock` — do not hand-edit it.
#
# The Affirmation Document Gate now comes from the shared workflow. This
# repository's local repair (.github/affirmation-trusted/) remains the
# reference implementation for the upstream defect it documents; see that
# directory's README.

name: Central Estate CI/CD Audit

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

# Least privilege: the called workflow only reads this repository's tree.
permissions:
  contents: read

jobs:
  estate-audit:
    uses: hyperpolymath/proven-cicd-and-workflows/.github/workflows/main-estate-audit.yml@3120495390635096552935d904652789253938e8 # suite main, 2026-11-09
