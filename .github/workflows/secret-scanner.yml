name: "🔴 Gate: Secret scan"
on:
  pull_request:
  push:
    branches: [main]
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
permissions:
  contents: read
jobs:
  scan:
    # Exactly the wrapper shape the called workflow specifies: `contents:
    # read` is its whole requirement, granted on the calling job (a job-level
    # block replaces, never merges with, the workflow-level one; the old
    # wrapper also carried a workflow-level `actions: read` that nothing in
    # the pin needed). The pin itself still resolved, but the wrapper shape
    # did not: runs failed at startup with zero jobs, invisible in
    # `gh pr checks`. Re-pinned 2026-10-28 alongside the other standards
    # reusables, whose pins had been orphaned; workflow-linter.yml now
    # re-resolves every reusable pin on each run.
    permissions:
      contents: read
    uses: metadatastician/standards/.github/workflows/secret-scanner-reusable.yml@34cf03f988b8ca95b91b45d9b3351f7d3babfb65
